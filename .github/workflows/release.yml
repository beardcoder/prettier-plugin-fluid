name: Release

# Rolling release: runs after CI succeeded on main. If the commits since the
# last version tag contain a feat, fix, perf, revert or breaking change, it
# bumps the version, prepends the conventional-changelog section to
# CHANGELOG.md, commits and tags that, publishes to npm and creates the GitHub
# release. Other commits (docs, chore, ci, ...) do not trigger a release.
#
# npm publishing uses trusted publishing (OIDC) with provenance, so no npm
# token is needed. It is bound to this workflow file name and the "npm"
# environment. `workflow_dispatch` re-runs the job, e.g. to finish a release
# whose tag exists but whose npm publish or GitHub release failed.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the release commit and tag, create the release
  id-token: write # npm trusted publishing

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          # Release exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; bun publish does not support it.
      - run: npm install --global npm@latest
      - run: bun install --frozen-lockfile

      - name: Prepare release
        id: prepare
        run: bun run release

      - name: Commit and tag
        if: steps.prepare.outputs.released == 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "chore(release): v${VERSION}"
          git tag --annotate "v${VERSION}" --message "v${VERSION}"
          # Fails without side effects if main moved on in the meantime; the
          # CI run of the newer commit then releases everything together.
          git push --atomic origin HEAD:main "v${VERSION}"

      # The following steps only act on versions whose tag is on GitHub, which
      # makes them safe to re-run.
      - name: Resolve version
        id: current
        run: |
          version="$(bun -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.current.outputs.tagged == 'true'
        env:
          VERSION: ${{ steps.current.outputs.version }}
        run: |
          name="$(bun -p "require('./package.json').name")"
          if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
            echo "${name}@${VERSION} is already published."
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub release
        if: steps.current.outputs.tagged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.current.outputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists."
          else
            bun run release notes "${VERSION}" > release-notes.md
            gh release create "v${VERSION}" --title "v${VERSION}" --notes-file release-notes.md --verify-tag
          fi
