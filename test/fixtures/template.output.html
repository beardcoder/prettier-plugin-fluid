<html
  xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
  data-namespace-typo3-fluid="true"
>
  {namespace v=FluidTYPO3\Vhs\ViewHelpers}
  <f:layout name="Default" />
  <f:section name="Main">
    <div class="b a" id="x" data-foo="1">
      <f:if condition="{items -> f:count()} > 0">
        <f:then>
          <ul>
            <f:for each="{items}" as="item" iteration="i">
              <li class="{f:if(condition: i.isFirst, then: 'first')} item">
                {item.title -> f:format.crop(maxCharacters: 20)}
              </li>
            </f:for>
          </ul>
        </f:then>
        <f:else>
          <p>
            Hello <strong>{user.name}</strong>,
            {f:translate(key: 'empty', default: 'No entries in this list — yet')}
          </p>
        </f:else>
      </f:if>
    </div>
    <f:link.action class="btn" action="show" arguments="{item: item}"
      >More</f:link.action
    >
    <f:comment>Comment {foo}</f:comment>
    <![CDATA[ foo {bar} <b> ]]>
    <!-- prettier-ignore -->
    <f:if condition="{a}"><b>keep   this</b></f:if>
    <script>var config = {settings.foo}; function x(){return 1}</script>
    <style>.a{color:red}</style>
    <f:render partial="Foo" arguments="{_all}" />
    <f:form.textfield
      property="name"
      additionalAttributes="{placeholder: \"Name\"}"
    />
  </f:section>
</html>
