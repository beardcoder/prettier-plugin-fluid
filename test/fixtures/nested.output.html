<f:for each="{categories}" as="category">
  <f:if
    condition="{f:count(subject: '{category.items}')} > 0 && {settings.show}"
  >
    <f:then>
      <h2
        class="{f:if(condition: '{category.active}', then: 'is-active {f:if(condition: category.special, then: \'is-special\')}', else: 'inactive')}"
      >
        {category.title -> f:format.case(mode: 'upper')}
      </h2>
      <f:for each="{category.items}" as="item">
        <f:switch expression="{item.type}">
          <f:case value="link">
            <f:link.typolink parameter="{item.link}" title="{f:translate(key: 'link.title', arguments: {0: '{item.title -> f:format.stripTags()}', 1: \"{f:format.date(date: item.date, format: 'd.m.Y')}\"})}">{item.title}</f:link.typolink>
          </f:case>
          <f:defaultCase><span>{item.title}</span></f:defaultCase>
        </f:switch>
      </f:for>
    </f:then>
    <f:else>
      <f:render
        section="Empty"
        arguments="{category: category, labels: {empty: '{f:translate(key: \'empty\')}'}}"
      />
    </f:else>
  </f:if>
</f:for>
