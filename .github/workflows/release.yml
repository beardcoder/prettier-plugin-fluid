name: Release

# Rolling release: runs after CI succeeded on main. The job is
# scripts/release.js (tested in test/release.test.js with local Git remotes
# and fake npm/gh), the same for both triggers:
#
# 1. `bun run check`, before anything is written.
# 2. If the commits since the last version tag contain a feat, fix, perf,
#    revert or breaking change, release-it (see .release-it.js) bumps the
#    version, prepends the conventional-changelog section to CHANGELOG.md,
#    commits, tags and pushes that atomically and creates the GitHub release.
#    Other commits (docs, chore, ci, ...) do not trigger a release.
# 3. If npm or the GitHub release lack the current version, they get exactly
#    the sources of its tag `v<version>` (which must be on main and have that
#    version), checked again in a worktree. Errors other than "not found"
#    abort instead of publishing.
#
# npm publishing uses trusted publishing (OIDC) with provenance, so no npm
# token is needed. It is bound to this workflow file name and the "npm"
# environment. `workflow_dispatch` re-runs the job, e.g. to finish a release
# whose tag exists but whose npm publish or GitHub release failed.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the release commit and tag, create the release
  id-token: write # npm trusted publishing

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          # Release exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; bun publish does not support it.
      - run: npm install --global npm@latest
      - run: bun install --frozen-lockfile

      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.js
