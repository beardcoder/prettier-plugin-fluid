name: Release

# Rolling release: runs after CI succeeded on main. If the commits since the
# last version tag contain a feat, fix, perf, revert or breaking change,
# release-it (see .release-it.js) bumps the version, prepends the
# conventional-changelog section to CHANGELOG.md, commits, tags and pushes that
# and creates the GitHub release. The workflow then publishes to npm. Other
# commits (docs, chore, ci, ...) do not trigger a release.
#
# npm publishing uses trusted publishing (OIDC) with provenance, so no npm
# token is needed. It is bound to this workflow file name and the "npm"
# environment. `workflow_dispatch` re-runs the job, e.g. to finish a release
# whose tag exists but whose npm publish or GitHub release failed.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the release commit and tag, create the release
  id-token: write # npm trusted publishing

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          # Release exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; bun publish does not support it.
      - run: npm install --global npm@latest
      - run: bun install --frozen-lockfile

      # Does nothing if no commit since the last tag warrants a release.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # release-it needs a branch; it pushes atomically, so this fails
          # without side effects if main moved on in the meantime. The CI run
          # of the newer commit then releases everything together.
          git switch --force-create main
          git branch --set-upstream-to origin/main
          bun run release --ci

      # The following steps only act on versions whose tag is on GitHub, which
      # makes them safe to re-run.
      - name: Resolve version
        id: current
        run: |
          version="$(bun -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.current.outputs.tagged == 'true'
        env:
          VERSION: ${{ steps.current.outputs.version }}
        run: |
          name="$(bun -p "require('./package.json').name")"
          if npm view "${name}@${VERSION}" version >/dev/null 2>&1; then
            echo "${name}@${VERSION} is already published."
          else
            npm publish --provenance --access public
          fi

      # release-it creates the GitHub release; this only completes releases
      # whose run failed after the push.
      - name: Create GitHub release
        if: steps.current.outputs.tagged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.current.outputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists."
          else
            # The CHANGELOG.md section of the version, without its heading.
            awk -v heading="## [${VERSION}]" 'index($0, "## ") == 1 { p = index($0, heading) == 1; next } p' CHANGELOG.md > release-notes.md
            gh release create "v${VERSION}" --title "v${VERSION}" --notes-file release-notes.md --verify-tag
          fi
