<f:section name="Main">
<f:comment>
  Disabled: <v:variable.set name="x" value="{broken
</f:comment>
<v:variable.set name="teasers" value="{my:data.teasers(limit: '{settings.limit}', category: '{data.uid -> my:category.forContent()}')}" />
<my:grid columns="3" class="gap-4 grid"><f:for each="{teasers}" as="teaser"><my:card.teaser teaser="{teaser}" link="{v:uri.page(pageUid: teaser.pid)}"><my:icon name="{teaser.icon}" /> {teaser.title -> v:format.eliminate(whitespace: 1) -> f:format.crop(maxCharacters: 60)}</my:card.teaser></f:for></my:grid>
</f:section>
</html>
