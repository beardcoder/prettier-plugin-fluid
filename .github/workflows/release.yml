name: Release

# Publishes to npm when a GitHub release is published (tag vX.Y.Z).
# Requires the repository secret NPM_TOKEN: an npm granular access token with
# publish rights for @beardcoder/prettier-plugin-fluid and "bypass 2FA"
# enabled, since CI cannot enter a one-time password.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Verify tag matches package.json version
        run: |
          version="$(bun -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - run: bun run check
      - run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
