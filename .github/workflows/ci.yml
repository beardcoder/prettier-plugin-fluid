name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    # Releases are derived from commit messages, so they must follow
    # Conventional Commits.
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint commit messages
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A newly pushed branch has no "before" commit.
          if [ -z "$FROM" ] || [ "$FROM" = "0000000000000000000000000000000000000000" ]; then
            bunx commitlint --last --verbose
          else
            bunx commitlint --from "$FROM" --to "$TO" --verbose
          fi

  check:
    name: Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check

  node:
    # Prettier usually runs on Node for users of the plugin.
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      # Builds dist/ with this Node version and tests it.
      - run: bun run test:node

  package:
    # The packed npm package, installed with Prettier into a temporary
    # consumer project; nothing is published.
    name: Package, Prettier ${{ matrix.prettier }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prettier: ['3.0.0', '3']
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # Builds dist/ itself before packing.
      - run: bun run test:package --prettier ${{ matrix.prettier }}

  prettier-compat:
    name: Prettier ${{ matrix.prettier }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and latest release of the supported major version
        # of the peer dependency (^3.0.0).
        prettier: ['3.0.0', '3']
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Built with the Prettier types the package is developed and published
      # with; the tests then run it with the Prettier version under test.
      - run: bun run build
      - run: bun add --no-save prettier@${{ matrix.prettier }}
      - run: bun test
